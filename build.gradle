plugins {
    id('fabric-loom') version("${loom_version}")    
}

def base_name          = project.archives_base_name
def mod_version        = project.mod_version
def target_mc_version  = project.minecraft_version
def mc_versions        = target_mc_version
def loader_version     = project.loader_version
def fabric_api_version = project.fabric_api_version

group = project.maven_group

base {
    archivesName = "${base_name}-${mod_version}_${mc_versions}-fabric"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "${base_name}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
        }
    }
}

dependencies {
    implementation('javax.annotation:javax.annotation-api:1.3.2')
    minecraft("com.mojang:minecraft:${target_mc_version}")
    mappings(loom.officialMojangMappings())
    modImplementation("net.fabricmc:fabric-loader:${loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
}

processResources {
    inputs.property("modVersion", mod_version)

    filesMatching("fabric.mod.json") {
        expand("version": mod_version)
    }
    inputs.property("archivesName", project.base.archivesName)
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
